<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Y1 Table Tennis YTT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Oxanium:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="gl" aria-label="桌球場地，按住對面球台選落點並拖曳擊球"></canvas>
  <div class="hud">
    <div class="top">
      <div class="brand">
        <h1>Y1 Table Tennis YTT</h1>
        <div class="menuWrap">
          <button type="button" class="menuBtn" id="menuBtn" aria-expanded="false" aria-controls="menu">
            <span class="burger" aria-hidden="true"><i></i><i></i><i></i></span>設定
          </button>
          <button type="button" class="menuBtn" id="pauseBtn" aria-pressed="false" title="暫停（P）">
            <span class="pauseIcon" aria-hidden="true"><i></i><i></i></span><span id="pauseLabel">暫停</span>
          </button>
          <div class="menu" id="menu" role="dialog" aria-label="設定" hidden>
            <section>
              <h2>資訊視窗</h2>
              <label class="row" for="showIn">顯示來球旋轉視窗<input type="checkbox" class="sw" id="showIn" checked></label>
              <label class="row child" for="hint" id="hintRow">旋轉提示<input type="checkbox" class="sw" id="hint" checked></label>
              <label class="row" for="showSh">顯示我的上一球視窗<input type="checkbox" class="sw" id="showSh" checked></label>
              <label class="row" for="showHelp">顯示操作教學<input type="checkbox" class="sw" id="showHelp" checked></label>
            </section>
            <section>
              <h2>板型</h2>
              <label class="row" for="ark">電腦板型<select id="ark"></select></label>
              <label class="row" for="prk">我的板型<select id="prk"></select></label>
              <label class="row" for="showRk">顯示我的板型屬性<input type="checkbox" class="sw" id="showRk" checked></label>
            </section>
            <section>
              <h2>對手</h2>
              <label class="row" for="lvl">對手難度
                <select id="lvl">
                  <option value="easy">簡單</option>
                  <option value="normal" selected>普通</option>
                  <option value="hard">困難</option>
                </select>
              </label>
            </section>
            <section>
              <h2>其他</h2>
              <label class="row" for="slow">慢動作 0.5×<input type="checkbox" class="sw" id="slow"></label>
              <label class="row" for="snd">音效<input type="checkbox" class="sw" id="snd" checked></label>
            </section>
          </div>
        </div>
        <div class="rk" id="rkCard"></div>
      </div>
      <div class="score">
        <div class="side"><div class="who" id="whoP"><span class="srv"></span>你</div><div class="num" id="sP">0</div></div>
        <div class="colon">:</div>
        <div class="side"><div class="who" id="whoA"><span class="srv"></span>電腦</div><div class="num" id="sA">0</div></div>
        <div class="status" id="status">輪到你發球</div>
      </div>
      <div></div>
    </div>

    <div class="bottom">
      <div class="card" id="inCard">
        <div class="lab" id="inLab">來球旋轉</div>
        <div class="main" id="inMain">—</div>
        <div class="sub" id="inSub">電腦擊球後顯示旋轉和建議刷法</div>
      </div>
      <div class="help" id="helpBox">
        移動滑鼠就是移動球拍，<b>揮過球</b>就會擊球，系統會依揮法和擊球位置判斷技術<br>
        <span class="keys">拉：由下往上快揮　挑：台內短球往上輕挑　擰：反手在台內往右上擰　切：往下輕切（輕＝擺短、重＝劈長）</span><br>
        <span class="keys">削：退到台外往下大力削　扣殺：高球用力揮　擋：拍子不動</span>　·　發球：點一下拋球，球落下時揮拍　·　P：暫停
      </div>
      <div class="card" id="shCard">
        <div class="lab">你的上一球</div>
        <div class="main" id="shMain">—</div>
        <div class="sub" id="shSub">擊球後顯示揮拍速度、旋轉和吃轉情況</div>
        <div class="sub" id="shSub2"></div>
      </div>
    </div>
  </div>

  <div class="banner" id="banner" hidden></div>
  <div class="toast" id="toast" hidden></div>
  <div class="overlay" id="pauseOv" hidden>
    <div class="box">
      <div class="lab">比賽暫停</div>
      <div class="final" id="pauseScore">0 : 0</div>
      <p>按 P、Esc 或下面的按鈕回到比賽</p>
      <button id="resumeBtn" type="button">繼續比賽</button>
    </div>
  </div>
  <div class="overlay" id="over" hidden>
    <div class="box">
      <div class="lab">比賽結束</div>
      <div class="final" id="final">11 : 7</div>
      <p id="finalMsg">你贏了</p>
      <button id="again" type="button">再來一局</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
