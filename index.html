<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旋轉桌球實驗室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Oxanium:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="gl" aria-label="桌球場地，按住對面球台選落點並拖曳擊球"></canvas>
  <div class="hud">
    <div class="top">
      <div class="brand">
        <h1>旋轉桌球實驗室</h1>
        <div class="opts">
          <label class="opt" for="lvl">對手
            <select id="lvl">
              <option value="easy">簡單</option>
              <option value="normal" selected>普通</option>
              <option value="hard">困難</option>
            </select>
          </label>
          <label class="opt" for="prk">你的板型
            <select id="prk"></select>
          </label>
          <label class="opt" for="ark">電腦板型
            <select id="ark"></select>
          </label>
          <label class="opt" for="hint"><input type="checkbox" id="hint" checked> 旋轉提示</label>
          <label class="opt" for="slow"><input type="checkbox" id="slow"> 慢動作 0.5×</label>
          <button type="button" class="opt lobBtn" id="lob" aria-pressed="false">放高球（Shift）</button>
        </div>
        <div class="rk" id="rkCard"></div>
      </div>
      <div class="score">
        <div class="side"><div class="who" id="whoP"><span class="srv"></span>你</div><div class="num" id="sP">0</div></div>
        <div class="colon">:</div>
        <div class="side"><div class="who" id="whoA"><span class="srv"></span>電腦</div><div class="num" id="sA">0</div></div>
        <div class="status" id="status">輪到你發球</div>
      </div>
      <div></div>
    </div>

    <div class="bottom">
      <div class="card">
        <div class="lab" id="inLab">來球旋轉</div>
        <div class="main" id="inMain">—</div>
        <div class="sub" id="inSub">電腦擊球後顯示旋轉和建議刷法</div>
      </div>
      <div class="help">
        移動滑鼠就是移動球拍，<b>揮過球</b>就會擊球，系統會依揮法和擊球位置判斷技術<br>
        <span class="keys">拉：由下往上快揮　挑：台內短球往上輕挑　擰：反手在台內往右上擰　切：往下輕切（輕＝擺短、重＝劈長）</span><br>
        <span class="keys">削：退到台外往下大力削　扣殺：高球用力揮　擋：拍子不動</span>　·　發球：點一下拋球，球落下時揮拍
      </div>
      <div class="card">
        <div class="lab">你的上一球</div>
        <div class="main" id="shMain">—</div>
        <div class="sub" id="shSub">擊球後顯示揮拍速度、旋轉和吃轉情況</div>
        <div class="sub" id="shSub2"></div>
      </div>
    </div>
  </div>

  <div class="banner" id="banner" hidden></div>
  <div class="toast" id="toast" hidden></div>
  <div class="overlay" id="over" hidden>
    <div class="box">
      <div class="lab">比賽結束</div>
      <div class="final" id="final">11 : 7</div>
      <p id="finalMsg">你贏了</p>
      <button id="again" type="button">再來一局</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
